name: Project Portfolio Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real GitHub snapshot calculations
        run: python -m unittest discover -s tests -v
      - name: Validate labeled synthetic DataBridge model
        run: python cases/databridge/verify.py
